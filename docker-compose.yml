# NayePankh AI Assistant - Docker Compose Configuration
version: '3.8'

services:
  nayepankh-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nayepankh-assistant
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    env_file:
      - .env
    volumes:
      # Persist database
      - ./volunteers.db:/app/volunteers.db
      # Persist memory
      - ./memory:/app/memory
      # Persist logs
      - ./logs:/app/logs
      # Persist data
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - nayepankh-network

networks:
  nayepankh-network:
    driver: bridge
